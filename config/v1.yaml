# EUR/USD BUY Entry Alert — V1 configuration.
# Spec: docs/v1/strategy-rules-v1.md. Every strategy number lives here; code has none.
#
# Provenance tags:
#   [PDF]        stated in Ahmad's PDF
#   [PDF-INTERP] our explicit interpretation of an ambiguous/inconsistent PDF rule
#   [ENG]        engineering parameter (tunable, compared in backtest)
#   [POLICY]     V1 product / alert / execution policy (not strategy logic)
#   [PDF-CORRECTION] documented fix of a PDF error/omission (docs/claude_thinking/pdf-review.md)

version: 1

instrument:
  symbol: EURUSD
  digits: 5              # [ENG] 5-digit quotes; 1 point = 0.00001
  pointsPerPip: 10       # [ENG] 1 pip = 0.0001

account:                 # [POLICY, D6] configuration assumption, not architecture
  currency: USD
  type: standard
  balance: 1000          # [POLICY] updated manually by the trader (no Exness API)
  riskPercent: 1.0       # [PDF] 1–2% per trade
  maxRiskPercent: 2.0    # [PDF] config above this is rejected; actual risk above it rejects the alert
  pipValuePerLot: 10     # [ENG, D6] USD per pip per 1.00 lot (EUR/USD, USD account, 100k units)
  commissionPerLotRoundTrip: 0  # [PDF-CORRECTION P5] 0 ONLY because the approved account is Standard USD (spread-only).
                                # Any other account: set its actual round-trip commission per 1.00 lot.
  lotStep: 0.01          # [ENG]
  minLot: 0.01           # [ENG]
  maxLot: 1.0            # [POLICY] hard safety cap

indicators:
  emaFast: 50            # [PDF]
  emaSlow: 200           # [PDF]
  rsiPeriod: 14          # [PDF]
  warmupCandles: 1000    # [ENG] EMA200 convergence

strategy:
  pullbackLookback: 3    # [ENG] touch window i-2..i
  swingLookback: 20      # [ENG] prior-move window, strictly before first touch
  rsi:
    oversold: 35         # [PDF-INTERP, D1] experimental; PDF baseline is 30 — backtest both
    mid: 50              # [PDF]
    lookback: 5          # [ENG]
    mode: both           # [ENG] both | recovery_only | above_mid_only
    requireRising: true  # [PDF-INTERP] "recovering"
  pin:
    wickBodyRatio: 2.0   # [ENG]
    wickRangeRatio: 0.6  # [ENG]
    maxUpperRatio: 0.2   # [ENG]
    requireBullishBody: false  # [PDF-INTERP] hammer may be either colour
  timeframes:            # all [ENG]
    M5:  { touchTolPips: 1.5, minSwingPips: 6, minRangePips: 2, entryOffsetPips: 0.5, slBufferPips: 1.5, outcomeHorizons: [12, 48, 288] }  # V1.1 (D9); scaled from M15
    M15: { touchTolPips: 2, minSwingPips: 8,  minRangePips: 3, entryOffsetPips: 1.0, slBufferPips: 2, outcomeHorizons: [4, 16, 96] }
    M30: { touchTolPips: 3, minSwingPips: 10, minRangePips: 4, entryOffsetPips: 1.5, slBufferPips: 2, outcomeHorizons: [4, 8, 48] }
    H1:  { touchTolPips: 5, minSwingPips: 15, minRangePips: 5, entryOffsetPips: 2.0, slBufferPips: 3, outcomeHorizons: [4, 8, 24] }

entry:
  mode: close_offset     # [ENG, D3] close_offset | candle_mid — both are Buy Limit prices (production is always Buy Limit)
  validCandles: 1        # [POLICY] advisory expiry shown in the email; not from the PDF

sizing:
  minSlPips: 5           # [ENG] prevents oversized lots

alerts:                  # all [POLICY]
  timezone: Asia/Dubai
  windowStart: "08:00"
  windowEnd: "23:00"
  maxPerDay: 3
  overCapRule: chronological
  cooldownCandles: 3     # [POLICY, D4]
  liveTimeframe: H1      # [POLICY, D8] PLACEHOLDER ONLY — NOT selected. Unused by code; the owner defers
                         # the choice (15m/30m/1H stay in the comparison) until the Jev forward test is evaluated.

execution:               # all [POLICY] — spec §8
  quoteMode: strict      # strict | candle_close_fallback
  maxQuoteAgeSec: 10
  maxSignalLatencySec: 120
  minLimitDistancePips: 0
  candleSettleSec: 5
  assumedSpreadPips: 1.0 # only used when no Ask data exists

selection:               # V1.1 daily selector (owner decision D9: exactly 3 alerts per trading day)
  mode: signals          # [POLICY] signals = V1 behaviour | daily_top3 = V1.1 (only after the holdout gate)
  timeframes: [M5, M15, M30, H1]   # [ENG] candidate timeframes for daily_top3
  immediateMinScore: 4   # [ENG] a candidate with this many of the 4 rules is sent at once (4 = full V1 signal)
  fallback: true         # [POLICY] true = fill every slot (D9); false = Ahmad's full setup only (D10), slots may stay empty
  weekdays: [1, 2, 3, 4, 5]        # [POLICY] trading days (local weekday, 0 = Sunday)
  slots:                 # [POLICY] one alert per slot, local time (alerts.timezone)
    - { start: "08:00", end: "13:00" }
    - { start: "13:00", end: "18:00" }
    - { start: "18:00", end: "23:00" }

backtest:
  placementDelaySec: 60  # [ENG] simulated trader reaction time
  includePdfMarketBaseline: true  # [PDF-CORRECTION P6] also run the PDF's market-at-next-open entry (Ask-filled) as a
                                  # backtest-only baseline; never used for production alerts
